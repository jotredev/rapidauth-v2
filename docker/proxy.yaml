services:
  caddy:
    image: caddy:2.11.7-alpine
    profiles: ["vps"]
    restart: unless-stopped
    environment:
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
