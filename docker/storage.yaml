services:
  storage:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    profiles: ["${STORAGE_DRIVER:-local}"]
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY_ID:-rapidauth}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_ACCESS_KEY:-replace-with-a-long-random-password}"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 2m

  storage-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    profiles: ["${STORAGE_DRIVER:-local}"]
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-rapidauth-avatars}"]
    environment:
      MC_HOST_local: "http://${S3_ACCESS_KEY_ID:-rapidauth}:${S3_SECRET_ACCESS_KEY:-replace-with-a-long-random-password}@storage:9000"
    depends_on:
      storage:
        condition: service_healthy

  storage-public-read:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    profiles: ["${STORAGE_DRIVER:-local}"]
    entrypoint: ["mc"]
    command: ["anonymous", "set", "download", "local/${S3_BUCKET:-rapidauth-avatars}"]
    environment:
      MC_HOST_local: "http://${S3_ACCESS_KEY_ID:-rapidauth}:${S3_SECRET_ACCESS_KEY:-replace-with-a-long-random-password}@storage:9000"
    depends_on:
      storage-init:
        condition: service_completed_successfully

volumes:
  storage_data:
