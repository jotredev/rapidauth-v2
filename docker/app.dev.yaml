services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://rapidauth:rapidauth@db:5432/rapidauth?sslmode=disable
      BETTER_AUTH_URL: "http://localhost:${APP_PORT:-3000}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-replace-with-a-unique-random-64-character-hex-secret}"
      SUPPORT_EMAIL: "${SUPPORT_EMAIL:-support@example.invalid}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      HOST: "0.0.0.0"
      MAILPIT_SMTP_ADDRESS: "mailpit:1025"
      DOCKER_DEV_POLLING: "${DOCKER_DEV_POLLING:-true}"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
        required: false
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${STUDIO_PORT:-5555}:5555"
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next

volumes:
  app_node_modules:
  app_next:
