services:
  cron:
    image: alpine:3.20
    restart: unless-stopped
    scale: 0${CRON_SECRET:+1}
    env_file:
      - path: ../.env
        required: false
    environment:
      CRON_SECRET: "${CRON_SECRET:-}"
      CRON_SCHEDULE: "${CRON_SCHEDULE:-0 3 * * *}"
    depends_on:
      app:
        condition: service_started
    command:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$CRON_SECRET" ]; then
          echo "CRON_SECRET is not configured; scheduled cleanup will not run."
          exit 0
        fi

        printenv CRON_SECRET | sed "s/'/'\\\\''/g" | sed "1s/^/export CRON_SECRET='/; \$$s/\$$/'/" > /etc/cron.env

        cat << 'CLEANUP' > /usr/local/bin/cleanup
        #!/bin/sh
        set -e
        if [ -f /etc/cron.env ]; then
          . /etc/cron.env
        fi
        echo "Running scheduled cleanup at $$(date -u)..."
        wget -q -O - --header="Authorization: Bearer $$CRON_SECRET" "http://app:3000/api/cron/cleanup"
        echo ""
        CLEANUP
        chmod +x /usr/local/bin/cleanup

        echo "$${CRON_SCHEDULE} /usr/local/bin/cleanup" > /etc/crontabs/root
        echo "Scheduled cleanup registered with schedule: $${CRON_SCHEDULE}"
        exec crond -f -l 2
