services:
  cron:
    image: alpine:3.24
    restart: unless-stopped
    # With CRON_SECRET, scale evaluates to 1; without it, scale evaluates to 0 and the container stays stopped.
    scale: 0${CRON_SECRET:+1}
    env_file:
      - path: ../.env
        required: false
    environment:
      CRON_SECRET: "${CRON_SECRET:-}"
    depends_on:
      app:
        condition: service_started
    command:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$CRON_SECRET" ]; then
          echo "CRON_SECRET is not configured; scheduled cleanup will not run."
          exit 0
        fi

        printenv CRON_SECRET | sed "s/'/'\\\\''/g" | sed "1s/^/export CRON_SECRET='/; \$$s/\$$/'/" > /etc/cron.env

        cat << 'CLEANUP' > /usr/local/bin/cleanup
        #!/bin/sh
        set -e
        if [ -f /etc/cron.env ]; then
          . /etc/cron.env
        fi
        echo "Running scheduled cleanup at $$(date -u)..."
        wget -q -O - --header="Authorization: Bearer $$CRON_SECRET" "http://app:3000/api/cron/cleanup"
        echo ""
        CLEANUP
        chmod +x /usr/local/bin/cleanup

        echo "0 3 * * * /usr/local/bin/cleanup" > /etc/crontabs/root
        echo "Scheduled cleanup registered for 03:00 UTC daily (0 3 * * *)"
        exec crond -f -l 2
