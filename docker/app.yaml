services:
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://rapidauth:rapidauth@db:5432/rapidauth?sslmode=disable
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bunx", "prisma", "migrate", "status"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    image: ghcr.io/jotredev/rapidauth-v2:2.3.0
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
      args:
        SUPPORT_EMAIL: "${SUPPORT_EMAIL:-support@example.invalid}"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rapidauth:rapidauth@db:5432/rapidauth?sslmode=disable
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-replace-with-a-unique-random-64-character-hex-secret}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      SUPPORT_EMAIL: "${SUPPORT_EMAIL:-support@example.invalid}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      CRON_SECRET: "${CRON_SECRET:-}"
      FROM_EMAIL: "${FROM_EMAIL:-RapidAuth <onboarding@resend.dev>}"
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      S3_REGION: "${S3_REGION:-auto}"
      S3_BUCKET: "${S3_BUCKET:-rapidauth-avatars}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-true}"
      TRUSTED_PROXY: "${TRUSTED_PROXY:-none}"
      NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"
      MAILPIT_SMTP_ADDRESS: "mailpit:1025"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
        required: false
      storage-public-read:
        condition: service_completed_successfully
        required: false
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - app_storage:/app/storage

volumes:
  app_storage:
