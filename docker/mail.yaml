services:
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    # Without RESEND_API_KEY, Mailpit is a normal service. With a key it is
    # assigned a profile, so Compose skips it unless explicitly requested.
    profiles: ["${RESEND_API_KEY:+resend-configured}"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
